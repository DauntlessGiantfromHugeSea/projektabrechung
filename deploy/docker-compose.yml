# Deployment HINTER dem vorhandenen Reverse-Proxy "fbe-caddy".
#
# Diese App startet KEINEN eigenen Caddy. Sie laeuft nur intern und haengt
# sich in das Docker-Netz des bestehenden Proxys (fbe-tools_default), damit
# fbe-caddy sie als "projektabrechnung:8080" erreichen kann.
#
# Zusaetzlich wird 8080 NUR auf 127.0.0.1 veroeffentlicht -- so kannst du die
# /report/*-Endpoints lokal (bzw. per SSH-Tunnel) erreichen, ohne sie ins
# Internet zu haengen.
#
# Start:  docker compose up --build -d

name: projektabrechnung

# Postfach für den E-Mail-Verteiler (Microsoft 365). Werte aus deploy/.env,
# siehe DEPLOY.md "Postfach für den Verteiler". Leer = Postfach-Abruf ruht.
x-verteiler-postfach: &verteiler-postfach
  VERTEILER_MAIL_POSTFACH: "${VERTEILER_MAIL_POSTFACH:-}"
  VERTEILER_MAIL_TENANT_ID: "${VERTEILER_MAIL_TENANT_ID:-}"
  VERTEILER_MAIL_CLIENT_ID: "${VERTEILER_MAIL_CLIENT_ID:-}"
  VERTEILER_MAIL_CLIENT_SECRET: "${VERTEILER_MAIL_CLIENT_SECRET:-}"
  VERTEILER_MAIL_INTERN_DOMAINS: "${VERTEILER_MAIL_INTERN_DOMAINS:-}"
  VERTEILER_MAIL_INTERVALL_MIN: "${VERTEILER_MAIL_INTERVALL_MIN:-10}"

services:
  app:
    build: ..
    container_name: projektabrechnung
    restart: unless-stopped
    expose:
      - "8080"                       # erreichbar fuer fbe-caddy im selben Netz
    ports:
      - "127.0.0.1:8080:8080"        # nur lokal: fuer /report/* und Tests
    environment:
      # --- Webhook-Empfang ---
      WEBHOOK_PATH: "/timemoto"
      SHARED_SECRET: "${SHARED_SECRET:-}"   # aus deploy/.env (TimeMoto-Secret)
      LOG_FILE: "/data/events.jsonl"

      # --- Bericht ---
      PROJECT_CODE: "${PROJECT_CODE:-}"   # Projekt(teil)code; leer = alle Projekte
      # PROJECT_FIELD: "projectName"
      REPORT_DIR: "/data/reports"
      REPORT_TIMEZONE: "Europe/Berlin"
      # Basis-URL für Download-Links in Mails (öffentlich erreichbar):
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://intern.rss-fb.com}"

      # --- Web-Interface / Login ---
      # Werte kommen aus der Datei deploy/.env (siehe DEPLOY.md). Ohne
      # gesetztes ADMIN_PASSWORD ist kein Login moeglich.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_HTTPS_ONLY: "${SESSION_HTTPS_ONLY:-true}"

      # --- Microsoft-Login (Entra ID / Azure AD) ---
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_CLIENT_SECRET: "${MS_CLIENT_SECRET:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-organizations}"
      MS_ALLOWED_DOMAINS: "${MS_ALLOWED_DOMAINS:-}"

      # --- Wochenplan ---
      SCHEDULER_ENABLED: "true"
      REPORT_CRON_DAY_OF_WEEK: "mon"
      REPORT_CRON_HOUR: "7"
      REPORT_CRON_MINUTE: "0"

      # --- E-Mail (Werte aus deploy/.env) ---
      # Empfohlen, wenn der Hoster SMTP blockt: Brevo-HTTP-API (Port 443).
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_SSL: "${SMTP_SSL:-false}"
      REPORT_RECIPIENTS: "${REPORT_RECIPIENTS:-}"
      REPORT_SUBJECT_PREFIX: "${REPORT_SUBJECT_PREFIX:-Projektzeiten}"
    volumes:
      - ./data:/data
    networks:
      - fbe-tools

  # E-Mail-Verteiler (Reach) unter https://intern.rss-fb.com/verteiler/.
  # Nur auf 127.0.0.1 veröffentlicht: erreichbar von außen nur über den
  # Caddy-Dienst des Servers, der jede Anfrage per forward_auth gegen den
  # Intranet-Login prüft (nur Administratoren). Die App prüft den Login
  # zusätzlich selbst über VERTEILER_AUTH_URL.
  verteiler:
    build: ../verteiler
    container_name: verteiler
    restart: unless-stopped
    expose:
      - "8501"
    ports:
      - "127.0.0.1:8501:8501"        # nur lokal, für den Caddy-Dienst
    environment:
      <<: *verteiler-postfach
      VERTEILER_AUTH_URL: "http://projektabrechnung:8080/auth/verteiler"
    volumes:
      - verteiler-daten:/data        # verteiler.db + backups/
    depends_on:
      - app
    networks:
      - fbe-tools

  # Holt alle paar Minuten neue Mails aus dem Verteiler-Postfach und übernimmt
  # die Adressen (Absender, An, CC, Mailtext). Gleiche Datenbank wie "verteiler".
  # Ohne VERTEILER_MAIL_* in deploy/.env ruht der Container nur.
  verteiler-postfach:
    build: ../verteiler
    container_name: verteiler-postfach
    restart: unless-stopped
    command: ["python", "-m", "verteiler_core.postfach"]
    environment:
      <<: *verteiler-postfach
    volumes:
      - verteiler-daten:/data
    healthcheck:
      disable: true                  # kein Webserver in diesem Container
    networks:
      - fbe-tools

# Docker-Volume für die Verteiler-Datenbank (bleibt bei Updates erhalten).
volumes:
  verteiler-daten:

# Das bestehende Netz des fbe-caddy-Stacks einbinden (nicht selbst anlegen).
networks:
  fbe-tools:
    external: true
    name: fbe-tools_default
