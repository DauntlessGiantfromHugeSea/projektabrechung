# Deployment HINTER dem vorhandenen Reverse-Proxy "fbe-caddy".
#
# Diese App startet KEINEN eigenen Caddy. Sie laeuft nur intern und haengt
# sich in das Docker-Netz des bestehenden Proxys (fbe-tools_default), damit
# fbe-caddy sie als "projektabrechnung:8080" erreichen kann.
#
# Zusaetzlich wird 8080 NUR auf 127.0.0.1 veroeffentlicht -- so kannst du die
# /report/*-Endpoints lokal (bzw. per SSH-Tunnel) erreichen, ohne sie ins
# Internet zu haengen.
#
# Start:  docker compose up --build -d

name: projektabrechnung

services:
  app:
    build: ..
    container_name: projektabrechnung
    restart: unless-stopped
    expose:
      - "8080"                       # erreichbar fuer fbe-caddy im selben Netz
    ports:
      - "127.0.0.1:8080:8080"        # nur lokal: fuer /report/* und Tests
    environment:
      # --- Webhook-Empfang ---
      WEBHOOK_PATH: "/timemoto"
      SHARED_SECRET: ""
      LOG_FILE: "/data/events.jsonl"

      # --- Bericht ---
      PROJECT_CODE: ""               # Projekt(teil)code; leer = alle Projekte
      # PROJECT_FIELD: "projectCode"
      REPORT_DIR: "/data/reports"
      REPORT_TIMEZONE: "Europe/Berlin"

      # --- Web-Interface / Login ---
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: ""           # SETZEN! ohne Passwort ist kein Login moeglich
      # Fester Schluessel = Sessions ueberleben Neustarts (sonst zufaellig):
      SESSION_SECRET: ""           # z. B. Ausgabe von: openssl rand -hex 32
      SESSION_HTTPS_ONLY: "true"   # bei reinem HTTP-Test auf "false"

      # --- Wochenplan ---
      SCHEDULER_ENABLED: "true"
      REPORT_CRON_DAY_OF_WEEK: "mon"
      REPORT_CRON_HOUR: "7"
      REPORT_CRON_MINUTE: "0"

      # --- E-Mail (spaeter ausfuellen) ---
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_STARTTLS: "true"
      SMTP_SSL: "false"
      REPORT_RECIPIENTS: ""
      REPORT_SUBJECT_PREFIX: "Projektzeiten"
    volumes:
      - ./data:/data
    networks:
      - fbe-tools

# Das bestehende Netz des fbe-caddy-Stacks einbinden (nicht selbst anlegen).
networks:
  fbe-tools:
    external: true
    name: fbe-tools_default
